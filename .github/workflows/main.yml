name: J6primelte

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04   # jangan pakai latest biar stabil

    steps:
    - name: Checkout source
      uses: actions/checkout@v4
      
    - name: Initializing environment
      run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install git make bc bison \
          openssl curl zip kmod cpio flex libelf-dev \
          libssl-dev libtfm-dev wget device-tree-compiler \
          ca-certificates python3 python2 binutils \
          binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi

    - name: Building Kernel
      env:
        TZ: Asia/Jakarta
        CHATID: -1002287610863
        BOT_TOKEN: 7868194496:AAGY7WwRRbeCOPYOnczoCPh2psC43Q0F3JI
      run: |
        chmod +x kernel.sh
        bash kernel.sh
        
